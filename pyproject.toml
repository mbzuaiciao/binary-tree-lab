[project]
name = "binary-tree-lab"
version = "1.0.0"
description = "Readable BST and AVL reference algorithms"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/tree_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
